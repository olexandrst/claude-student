{% extends "base.html" %}
{% block title %}Повідомлення{% endblock %}
{% block content %}
<div class="page-head page-head--row">
  <div>
    <h1 class="display-lg">Повідомлення</h1>
    <p class="lead">Листування з викладачами, деканатом і службами університету</p>
  </div>
  <button class="btn btn--primary" type="button" id="composeBtn">{{ icon('plus', 18) }} Нове повідомлення</button>
</div>

<div class="messenger card">
  <aside class="messenger__threads">
    <div class="input-icon">
      {{ icon('search', 18) }}
      <label class="sr-only" for="threadSearch">Пошук розмов</label>
      <input class="input" id="threadSearch" placeholder="Пошук розмов">
    </div>
    <ul class="threads" id="threadList"></ul>
  </aside>
  <section class="messenger__chat" id="chat">
    <div class="empty">
      {{ icon('mail', 32) }}
      <p class="body-sm muted-alt">Оберіть розмову ліворуч</p>
    </div>
  </section>
</div>
{% endblock %}
